name: Build COGAM DIGITAL LIBRARY APK

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Use preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-$ANDROID_SDK_ROOT}" >> "$GITHUB_ENV"
          "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" --version || sdkmanager --version
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Install Android SDK platform
        run: |
          SDKMGR=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)
          if [ -z "$SDKMGR" ]; then echo "Android command-line tools missing" >&2; exit 1; fi
          yes | "$SDKMGR" --licenses >/dev/null || true
          "$SDKMGR" "platforms;android-35" "build-tools;35.0.0"
      - name: Build installable debug APK
        working-directory: android
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Prepare downloadable APK
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/debug/app-debug.apk release/COGAM-Digital-Library-v1.0.1.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: COGAM-Digital-Library-APK-v1.0.1
          path: release/COGAM-Digital-Library-v1.0.1.apk
      - name: Publish public APK download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view android-v1.0.1 >/dev/null 2>&1; then
            gh release upload android-v1.0.1 release/COGAM-Digital-Library-v1.0.1.apk --clobber
          else
            gh release create android-v1.0.1 release/COGAM-Digital-Library-v1.0.1.apk --title "COGAM DIGITAL LIBRARY Android v1.0.1" --notes "Updated Android companion with the current hosted COGAM Digital Library, refreshed COGAM launcher icon, and in-app Home navigation. This is a debug-signed WebView build for testing/personal installation and requires internet access. Some sign-in providers may require the external Browser button."
          fi
